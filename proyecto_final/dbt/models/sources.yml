version: 2

sources:
  - name: raw
    description: Datos tal como los carga Kestra desde Google Play (append-only, sin limpiar).
    database: PSET2_DB
    schema: RAW
    tables:
      - name: resenas_google_play
        identifier: RESENAS_GOOGLE_PLAY
        description: Una fila por reseña descargada. Puede repetir review_id entre cargas incrementales.
        loaded_at_field: extracted_at
        freshness:
          warn_after: {count: 8, period: day}
          error_after: {count: 15, period: day}
