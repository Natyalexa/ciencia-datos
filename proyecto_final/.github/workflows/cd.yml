# CD del código: cuando CI termina en verde para un push a main (merge), construye la imagen de
# la API y la publica en GitHub Container Registry con el hash del commit como tag.
# El MODELO no se despliega aquí: lo promueve una persona en kestra/reentrenamiento.yml.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publicar-imagen:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Nombre de la imagen (en minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/resenas-bancos-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: proyecto_final
          file: proyecto_final/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Resumen
        run: |
          echo "Imagen publicada: ${IMAGEN}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Para usarla: API_TAG=${{ github.event.workflow_run.head_sha }} en .env y docker compose pull api" >> "$GITHUB_STEP_SUMMARY"
