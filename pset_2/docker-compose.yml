volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local

services:
  postgres:
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Define KESTRA_DB_PASSWORD en el archivo .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:latest
    env_file:
      - .env
    pull_policy: always
    restart: unless-stopped
    # Kestra, by default, has a termination grace period of 5m. We need to wait a little more to be sure no active tasks are running.
    stop_grace_period: 6m
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD:?Define KESTRA_DB_PASSWORD en el archivo .env}
        kestra:
          # server:
          #   basic-auth:
          #     username: admin@kestra.io # it must be a valid email address
          #     password: Admin1234! # it must be at least 8 characters long with uppercase letter and a number
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      # The following is the management port, not exposed by default.
      # Note that exposing the management port is intended for development purpose as this port is un-authenticated by default
      # and expose sensitive information and actions.
      # - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # dbt Core. No se levanta con "docker compose up": se invoca a demanda,
  # por ejemplo: docker compose run --rm dbt run
  dbt:
    build: ./dbt
    image: pset2-dbt
    working_dir: /usr/app
    entrypoint: ["dbt"]
    environment:
      DBT_PROFILES_DIR: /usr/app
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:?Define SNOWFLAKE_ACCOUNT en el archivo .env}
    volumes:
      - ./dbt:/usr/app
      - ./secrets:/secrets:ro
    profiles: ["tools"]

  # Spark (modo local) construye la OBT a partir de Gold y la escribe en Snowflake.
  # No se levanta con "docker compose up": se ejecuta a demanda con
  #   docker compose run --rm spark
  spark:
    image: apache/spark:3.5.7-python3
    user: root
    working_dir: /opt/spark/work-dir
    environment:
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:?Define SNOWFLAKE_ACCOUNT en el archivo .env}
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./secrets:/secrets:ro
    command: >
      /opt/spark/bin/spark-submit
      --packages net.snowflake:spark-snowflake_2.12:3.1.7
      --conf spark.jars.ivy=/tmp/ivy
      --conf spark.driver.extraJavaOptions=--add-opens=java.base/java.nio=ALL-UNNAMED
      /opt/spark/work-dir/build_obt.py
    profiles: ["tools"]
